<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>介護タクシー配車依頼</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 20px; background-color: #f0f8ff; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { font-size: 1.5rem; text-align: center; color: #007bff; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input[type="text"], input[type="time"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        #map { width: 100%; height: 250px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #ddd; cursor: crosshair; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 10px; font-size: 1rem; cursor: pointer; font-weight: bold; margin-bottom: 10px; }
        .btn-location { background-color: #28a745; color: white; }
        .btn-submit { background-color: #007bff; color: white; }
        .radio-group { display: flex; gap: 10px; flex-wrap: wrap; padding: 5px 0; }
        .radio-group label { font-weight: normal; font-size: 0.9rem; display: flex; align-items: center; gap: 5px; }
        .hint { font-size: 0.8rem; color: #666; margin-bottom: 10px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h1>お迎え依頼</h1>

    <div class="input-group">
        <label for="userName">お名前</label>
        <input type="text" id="userName" placeholder="例：山田 太郎">
    </div>

    <div id="map"></div>
    <p class="hint">※地図をタップして場所を微調整できます</p>

    <button type="button" class="btn btn-location" onclick="getCurrentLocation()">📍 現在地を取得する</button>

    <div class="input-group">
        <label for="pickupTime">お迎え希望時間</label>
        <input type="time" id="pickupTime">
    </div>

    <div class="input-group">
        <label>ご希望の機材</label>
        <div class="radio-group">
            <label><input type="radio" name="equipment" value="普通車椅子" checked> 普通車椅子</label>
            <label><input type="radio" name="equipment" value="リクライニング車椅子"> リクライニング</label>
            <label><input type="radio" name="equipment" value="ストレッチャー"> ストレッチャー</label>
        </div>
    </div>

    <button type="button" class="btn btn-submit" onclick="submitReservation()">この内容で依頼を送る</button>
</div>

<script>
    let map;
    let marker;
    let currentCoords = { lat: null, lng: null };

    function initMap() {
        const initialPos = [35.0045, 135.8685]; // 滋賀県
        map = L.map('map').setView(initialPos, 15);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        marker = L.marker(initialPos).addTo(map);

        // ★追加：地図をクリックした時のイベント
        map.on('click', function(e) {
            updateMarker(e.latlng.lat, e.latlng.lng);
        });
    }

    // ピンの位置と座標データを更新する共通関数
    function updateMarker(lat, lng) {
        currentCoords.lat = lat;
        currentCoords.lng = lng;
        const newPos = [lat, lng];
        marker.setLatLng(newPos);
        // map.panTo(newPos); // 必要ならクリックした場所を中央に寄せる
    }

    function getCurrentLocation() {
        if (!navigator.geolocation) {
            alert("位置情報に対応していません");
            return;
        }
        navigator.geolocation.getCurrentPosition((position) => {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            map.setView([lat, lng], 17);
            updateMarker(lat, lng);
        }, () => {
            alert("位置情報の取得に失敗しました");
        });
    }

    function submitReservation() {
        const name = document.getElementById('userName').value;
        const time = document.getElementById('pickupTime').value;
        const equipment = document.querySelector('input[name="equipment"]:checked').value;

        if (!currentCoords.lat) { alert("地図で場所を指定してください"); return; }
        if (!name || !time) { alert("お名前と時間を入力してください"); return; }

        if (confirm("送信しますか？")) {
            fetch('/api/reserve', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: name,
                    time: time,
                    equipment: equipment,
                    coords: currentCoords
                })
            })
            .then(res => {
                if (res.ok) alert("送信しました！");
                else alert("サーバーエラーが発生しました。");
            })
            .catch(err => alert("通信エラーが発生しました。"));
        }
    }

    window.onload = initMap;
</script>

</body>
</html>
