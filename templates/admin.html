<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>お迎え依頼一覧</title>
    <style>
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #333; color: white; }
        tr:nth-child(even) { background-color: #f2 f2 f2; }
    </style>
</head>
<body>
    <h2>お迎え依頼一覧</h2>
    <button onclick="location.reload()">最新の情報に更新</button>
    <br><br>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>お名前</th>
                <th>希望時間</th>
                <th>現在地確認</th>
                <th>受付時刻</th>
            </tr>
        </thead>
        <tbody>
            {% for res in reservations %}
            <tr>
                <td>{{ res.id }}</td>
                <td>{{ res.name }} 様</td>
                <td>{{ res.pickup_time }}</td>
                <td>
                    <a href="https://www.google.com/maps?q={{ res.lat }},{{ res.lng }}" target="_blank">
                        📍 Googleマップで開く
                    </a>
                </td>
                <td>{{ res.created_at }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
